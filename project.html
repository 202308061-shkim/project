<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>김승환의 홈페이지</title>
</head>
<body>
  <!-- 실습 2: 시맨틱 태그로 구조화 + 시간표 테이블 + 연락처 폼 -->
  <header>
    <h1>김승환의 홈페이지</h1>
    <nav>
      <a href="#about">소개</a>
      <a href="#timetable">시간표</a>
      <a href="#contact">연락처</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>소개</h2>
      <img src="https://placehold.co/600x400?text=sh.kim" alt="프로필 사진">
      <p>안녕하세요, 정보통신공학과 김승환 입니다.</p>
      <ul>
        <li>전공: 정보통신공학과</li>
        <li>목표: 졸 업</li>
      </ul>
    </section>

    <section id="timetable">
      <h2>일주일 시간표</h2>
      <table border="1">
        <tr>
          <th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
        </tr>
        <tr>
          <td>1교시</td><td>사물인터넷</td><td></td><td>클라우드컴퓨팅</td><td></td><td></td>
        </tr>
        <tr>
          <td>2교시</td><td>사물인터넷</td><td></td><td>클라우드컴퓨팅</td><td></td><td></td>
        </tr>
	<tr>
		<td>3교시</td><td>웹개발실습</td><td></td><td></td><td></td><td>RF공학</td>
      </table>
    </section>

    <section id="contact">
      <h2>연락처</h2>
      <form>
        <p><label>이름 <input type="text" name="name"></label></p>
        <p><label>이메일 <input type="email" name="email"></label></p>
        <p><label>메시지<br><textarea name="message" rows="4" cols="40"></textarea></label></p>
        <button type="submit">보내기</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 김승환</p>
  </footer>
</body>
</html>
